name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libva-dev libdrm-dev

      - name: Configure
        run: meson setup build

      - name: Build
        run: meson compile -C build

      - name: Inspect driver
        run: |
          file build/venus_drv_video.so
          nm -D --defined-only build/venus_drv_video.so
